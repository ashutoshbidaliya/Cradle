
services:
  discovery-server:
    build:
      context: ./    # points to Cradle root folder where pom.xml is
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - cradle-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - cradle-net

